name: Morning Push Cron

# Déclenche /api/cron/morning-push. Ce workflow est le FILET DE SÉCURITÉ :
# le déclencheur principal est cron-job.org, précis à la minute. GitHub Actions
# n'est pas un ordonnanceur fiable pour un rendez-vous à heure fixe — le
# 2026-08-03 il n'a exécuté qu'UN des 12 déclenchements planifiés, avec 1h45 de
# retard, et personne n'a rien reçu. Il ne rattrape pas les occurrences
# manquées. L'idempotence de `last_notified_on` rend inoffensif le fait d'avoir
# deux déclencheurs : le premier arrivé envoie, le second ne trouve plus rien.
#
# Minutes décalées des heures rondes : 05:00 et 06:00 UTC sont des heures de
# pointe (tout le monde planifie à l'heure pile), c'est là que GitHub retarde
# et abandonne le plus. La plage 05h-10h UTC couvre la fenêtre de la route
# (07:00-12:00 Paris) en été comme en hiver.

on:
  schedule:
    - cron: '7,17,27,37,47,57 5-10 * * *'
  workflow_dispatch:

# Sérialise les runs : deux exécutions qui se recouvrent liraient le même lot
# de lignes non marquées et enverraient deux fois. cancel-in-progress: false
# car annuler à mi-lot laisserait des abonnements notifiés mais non marqués —
# pire que d'attendre la fin du run précédent.
concurrency:
  group: morning-push-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel cron endpoint
        env:
          # Un déclenchement manuel court-circuite la garde horaire : c'est une
          # intention explicite, pas un tick égaré. Les runs planifiés, eux,
          # restent soumis à la fenêtre.
          # En-tête et non query string : Vercel réécrit la requête avant la
          # fonction et `request.url` peut y perdre sa query (constaté le
          # 2026-08-03, le forçage était ignoré).
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "X-Force-Morning-Push: $FORCE" \
            https://trailcockpit.run/api/cron/morning-push)
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "Response: $body"
          if [ "$status" != "200" ]; then
            echo "::error::Cron endpoint returned non-200 status"
            exit 1
          fi
